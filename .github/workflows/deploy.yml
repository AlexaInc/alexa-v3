name: Deploy to Oracle VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync files to VM
      env:
        HOST: ${{ secrets.VM_HOST }}
        USER: ${{ secrets.VM_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$HOST "mkdir -p /home/ubuntu/alexa-v3"
        rsync -avz -e "ssh -o StrictHostKeyChecking=no" --exclude 'node_modules' --exclude '.git' ./ $USER@$HOST:/home/ubuntu/alexa-v3/

    - name: Install dependencies and Run
      env:
        HOST: ${{ secrets.VM_HOST }}
        USER: ${{ secrets.VM_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
          cd /home/ubuntu/alexa-v3
          
          # Dependencies install කිරීම (--legacy-peer-deps සමඟ)
          npm install --production --legacy-peer-deps

          # Screen එකෙන් app එක run කිරීම
          screen -S alexa-app -X quit || true
          pkill -f "node app.js" || true
          screen -d -m -S alexa-app node app.js
        EOF
