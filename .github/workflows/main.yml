name: Production Deploy to HF
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Start the Deployment in GitHub UI
      - name: Start GitHub Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      # 2. Trigger the actual Rebuild on Hugging Face
      - name: Trigger HF Factory Reboot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -X POST \
          -H "Authorization: Bearer $HF_TOKEN" \
          "https://huggingface.co/api/spaces/hansaka1/alexa/restart?factory=true"

      # 3. Update the Deployment to "Success" and link the URL
      - name: Update Deployment Status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://hansaka1-alexa.hf.space/