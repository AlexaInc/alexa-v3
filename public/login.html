<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Alexa v3</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.5rem;
            border-radius: 6px;
        }
    </style>
</head>

<body style="background: linear-gradient(135deg, #020617 0%, #0f172a 100%);">

    <nav class="navbar">
        <h1 onclick="location.href='./';">Alexa v3</h1>
    </nav>

    <div class="login-wrapper">
        <div class="login-card glass animate-fade">
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: var(--text-secondary); margin-bottom: 2.5rem;">Enter your credentials to access the command
                center.</p>

            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="admin">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn btn-primary" onclick="login()"
                style="width: 100%; padding: 0.9rem; font-size: 1rem; margin-top: 1rem;">
                Authorize Access
            </button>

            <p id="error-message" class="error-message">Invalid credentials. Please try again.</p>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    window.location.href = '/control';
                } else {
                    errorEl.style.display = 'block';
                    // Shake effect
                    const card = document.querySelector('.login-card');
                    card.style.animation = 'none';
                    card.offsetHeight; // trigger reflow
                    card.style.animation = 'shake 0.4s ease';
                }
            } catch (error) {
                console.error('Login error:', error);
            }
        }

        async function checkLoginStatus() {
            try {
                const response = await fetch('/is-logged-in');
                const data = await response.json();
                if (data.isLoggedIn) {
                    window.location.href = '/control';
                }
            } catch (error) {
                console.error("Error checking login status:", error);
            }
        }

        checkLoginStatus();

        // Add shake animation style
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-8px); }
                50% { transform: translateX(8px); }
                75% { transform: translateX(-8px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
